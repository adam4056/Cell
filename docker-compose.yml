version: "3.8"

services:
  cell2:
    build: .
    image: cell2:latest
    container_name: cell2
    stdin_open: true
    tty: true
    volumes:
      # Persistent data
      - cell2-data:/app/data
      # Optional: mount your config
      # - ./config.yaml:/app/data/config.yaml:ro
    environment:
      # Override API key via env var
      - CELL_API_KEY=${CELL_API_KEY:-}
      - CELL_API_BASE=${CELL_API_BASE:-https://api.deepseek.com}
      - CELL_MODEL=${CELL_MODEL:-deepseek-chat}
    # For TUI mode (interactive)
    # docker-compose run --rm cell2
    
    # For headless/server mode (future)
    # command: python -m cell2.server
    # ports:
    #   - "8080:8080"

volumes:
  cell2-data:
    driver: local
